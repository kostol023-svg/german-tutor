name: MicTest
options:
  bundleIdPrefix: com.kostol023
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MicTest:
    type: application
    platform: iOS
    sources:
      - App
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kostol023.mictest
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Мик-тест
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы проверить запись голоса в фоне.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
